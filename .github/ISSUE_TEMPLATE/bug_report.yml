name: Bug report
description: Something works wrongly or not at all
labels: ["type: bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happens, and what should happen instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Demo project
        2. ...
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Vulkan
        - OpenGL
        - Both
        - Not sure
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] It no longer happens
        - [ ] A test covers it
  - type: textarea
    id: start
    attributes:
      label: Where to start
      description: The files and functions to look at first, if you know them
