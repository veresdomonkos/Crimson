name: Feature request
description: Something new, or a better way to do something
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or wrong, and why it matters
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What the change covers, and what it leaves out
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      value: |
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: start
    attributes:
      label: Where to start
      description: The files and functions to look at first
