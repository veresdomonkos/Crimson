name: CI

# On pull requests, and on main to check the result of merging them
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch name, commit message and whitespace rules in CONTRIBUTING.md. The git hooks check them on each
  # commit, and this checks them again, as hooks can be skipped or not set up. Each check runs even when one before
  # it failed, so a run lists everything there is to fix.
  conventions:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    # The pull request's fields only reach the scripts through the environment, never written into them
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      BRANCH: ${{ github.head_ref }}

    steps:
      - name: Check out the branch, with its history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check the branch name
        run: sh tools/check_conventions.sh branch "$BRANCH"

      - name: Check the commit messages
        if: ${{ !cancelled() }}
        run: |
          status=0
          for commit in $(git rev-list --no-merges "$BASE..HEAD"); do
            git log -1 --format=%B "$commit" > "$RUNNER_TEMP/message"
            sh tools/check_conventions.sh message "$RUNNER_TEMP/message" "$(git log -1 --format=%h "$commit")" || status=1
          done
          exit $status

      - name: Check the whitespace of the changes
        if: ${{ !cancelled() }}
        run: sh tools/check_conventions.sh files "$BASE...HEAD"

  # Tests the build that gets released, then packages it. Every run has one to download from its page.
  # The runners have no GPU, so the GPU tests only get built here, and they run on Linux.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60

    defaults:
      run:
        shell: msys2 {0}

    env:
      VULKAN_SDK_VERSION: 1.4.350.0

    steps:
      - name: Check out, with the submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # The package includes the demo project, and LFS bandwidth is metered, so its files only download once
      - name: List the Git LFS files
        shell: pwsh
        run: git lfs ls-files --long | Out-File .lfs-files

      - name: Restore the Git LFS files
        uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-package-${{ hashFiles('.lfs-files') }}

      - name: Download the Git LFS files
        shell: pwsh
        run: git lfs pull --include="editor/resources/**,engine/resources/**,samples/**"

      # MSYS2's Vulkan library is named libvulkan-1.dll, which wouldn't be on a user's machine.
      # The SDK's is vulkan-1.dll, which graphics drivers install.
      - name: Restore the Vulkan SDK
        id: vulkan-sdk
        uses: actions/cache@v6
        with:
          path: C:\VulkanSDK
          key: vulkan-sdk-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        if: steps.vulkan-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_SDK_VERSION/windows/vulkan_sdk.exe" -OutFile $installer
          Start-Process -Wait -FilePath $installer -ArgumentList "--root C:\VulkanSDK\$env:VULKAN_SDK_VERSION --accept-licenses --default-answer --confirm-command install"

      - name: Install the toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            ccache:p
            lld:p

      - name: Show errors on the run's page
        shell: pwsh
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-mingw-release-${{ github.sha }}
          restore-keys: ccache-mingw-release-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          VULKAN_SDK: C:\VulkanSDK\${{ env.VULKAN_SDK_VERSION }}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCRIMSON_ENABLE_PROFILER=OFF

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: cmake --build build --target Editor CrimsonTests CrimsonGpuTests

      - name: Test
        run: ctest --test-dir build --label-exclude gpu --output-on-failure

      # It has to run on a machine with nothing but Windows and a graphics driver
      - name: Check what the executable needs
        run: |
          objdump -p build/editor/Editor.exe | grep 'DLL Name' | sed 's/.*: //' | tee imports.txt
          grep -q '^vulkan-1\.dll$' imports.txt
          ! grep -iE '^(lib|zlib)' imports.txt

      - name: Package
        run: |
          mkdir -p package/samples
          cp build/editor/Editor.exe LICENSE THIRD_PARTY_NOTICES.md README.md package/
          cp -r samples/Demo package/samples/

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: Crimson-windows-x64
          path: package
          retention-days: 14

  # An AppImage runs on systems with the same glibc or newer, so it is built on the oldest runner with a recent enough compiler
  linux-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      VULKAN_SDK_VERSION: 1.4.350.0
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
      # AppImages normally mount themselves with FUSE, which runners don't have
      APPIMAGE_EXTRACT_AND_RUN: 1

    steps:
      - name: Check out, with the submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download the embedded files from Git LFS
        run: git lfs pull --include="editor/resources/**,engine/resources/**"

      # The Ubuntu mirror is sometimes so slow that downloading the packages takes most of an hour, so the ones it
      # sent before come from the cache. apt still installs them as usual, and only downloads what is newer.
      - name: Restore the downloaded packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-package-${{ github.sha }}
          restore-keys: apt-package-

      # Without the limit a stalled mirror holds the job for an hour, with it the job fails and can be run again
      - name: Install the toolchain
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner rebuilds its man page index after every install, and nothing here reads it
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true"
          $apt update
          $apt install -y --no-install-recommends \
            cmake ninja-build ccache lld patchelf pkg-config file \
            libvulkan-dev libgl-dev libgl1-mesa-dri xvfb xauth \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libgtk-3-dev librsvg2-dev
          # Versions that were replaced go, so the cache doesn't grow forever, and the cache step can read the rest
          $apt autoclean
          sudo chown -R "$USER" ~/apt-archives

      # This Ubuntu's Vulkan headers are too old for the engine, so they come from the SDK, and only the loader from Ubuntu
      - name: Restore the Vulkan SDK
        id: vulkan-sdk
        uses: actions/cache@v6
        with:
          path: .vulkan-sdk
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Install the Vulkan SDK
        if: steps.vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .vulkan-sdk
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux/vulkan_sdk.tar.xz" | tar -xJ -C .vulkan-sdk

      - name: Show errors on the run's page
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-release-${{ github.sha }}
          restore-keys: ccache-linux-release-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          VULKAN_SDK: ${{ github.workspace }}/.vulkan-sdk/${{ env.VULKAN_SDK_VERSION }}/x86_64
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCRIMSON_BUILD_TESTS=OFF
          -DCRIMSON_ENABLE_PROFILER=OFF
          -DGLFW_BUILD_WAYLAND=OFF

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: cmake --build build --target Editor

      # The Vulkan loader and OpenGL have to come from the user's graphics driver, so they stay out of it
      - name: Make the AppImage
        env:
          DEPLOY_GTK_VERSION: 3
          OUTPUT: Crimson-x86_64.AppImage
        run: |
          curl -fsSLO "https://github.com/linuxdeploy/linuxdeploy/releases/download/$LINUXDEPLOY_VERSION/linuxdeploy-x86_64.AppImage"
          curl -fsSLO "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          # The fonts built into the editor are shipped with their licenses, which their own licenses ask for
          mkdir -p AppDir/usr/share/doc/crimson
          cp LICENSE THIRD_PARTY_NOTICES.md AppDir/usr/share/doc/crimson/

          PATH="$PWD:$PATH" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable build/editor/Editor \
            --desktop-file packaging/crimson.desktop \
            --icon-file editor/resources/icons/crimson.png \
            --plugin gtk \
            --exclude-library 'libvulkan*' \
            --output appimage

      - name: Check that the AppImage starts
        run: |
          ./Crimson-x86_64.AppImage --help

          # Opens the project manager on Mesa. Still running when the time is up is what a working editor does.
          status=0
          timeout 15 xvfb-run --auto-servernum ./Crimson-x86_64.AppImage -gl || status=$?
          test "$status" -eq 124

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: Crimson-linux-x86_64
          path: Crimson-x86_64.AppImage
          retention-days: 14

  # Runs everything. Without a GPU Mesa renders on the CPU, with llvmpipe for OpenGL and lavapipe for Vulkan,
  # and Xvfb is the display the windows open on. Debug builds turn the validation layers on.
  # The AddressSanitizer build reports memory errors. Leak checking is off, as the graphics drivers keep memory on purpose.
  linux:
    name: linux-${{ matrix.flavor }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: gcc
            flags: ""
          - flavor: asan
            flags: -fsanitize=address -fno-omit-frame-pointer

    steps:
      - name: Check out, with the submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download the embedded files from Git LFS
        run: git lfs pull --include="editor/resources/**,engine/resources/**"

      # The Ubuntu mirror is sometimes so slow that downloading the packages takes most of an hour, so the ones it
      # sent before come from the cache. apt still installs them as usual, and only downloads what is newer.
      - name: Restore the downloaded packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-linux-${{ matrix.flavor }}-${{ github.sha }}
          restore-keys: apt-linux-

      # Without the limit a stalled mirror holds the job for an hour, with it the job fails and can be run again
      - name: Install the toolchain
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner rebuilds its man page index after every install, and nothing here reads it
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives=$HOME/apt-archives -o APT::Keep-Downloaded-Packages=true"
          $apt update
          $apt install -y --no-install-recommends \
            cmake ninja-build ccache lld \
            libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers \
            libgl-dev libgl1-mesa-dri xvfb xauth \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev \
            libgtk-3-dev
          # Versions that were replaced go, so the cache doesn't grow forever, and the cache step can read the rest
          $apt autoclean
          sudo chown -R "$USER" ~/apt-archives

      - name: Show errors on the run's page
        run: echo "::add-matcher::.github/problem-matchers.json"

      - name: Restore the compiler cache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux-${{ matrix.flavor }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.flavor }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGLFW_BUILD_WAYLAND=OFF
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_C_FLAGS=${{ matrix.flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}"

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 1G
        run: cmake --build build --target Editor CrimsonTests CrimsonGpuTests
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure
